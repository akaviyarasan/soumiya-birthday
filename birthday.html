<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Birthday ThangaMayiluuuuuu 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1d2671,#c33764);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

/* Floating balloons */
.balloon{
  position:absolute;
  bottom:-100px;
  font-size:35px;
  animation:float 8s linear infinite;
}

@keyframes float{
  0%{transform:translateY(0)}
  100%{transform:translateY(-110vh)}
}

/* Card */
.card{
  background:rgba(255,255,255,0.12);
  padding:40px 30px;
  border-radius:25px;
  text-align:center;
  max-width:380px;
  backdrop-filter:blur(15px);
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
  animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

#typewriter{
  font-size:16px;
  line-height:1.7;
  margin-top:15px;
  min-height:120px;
}

button{
  margin-top:20px;
  padding:12px 22px;
  border:none;
  border-radius:25px;
  background:#ffffff;
  color:#c33764;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}

/* Popup */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:white;
  color:#c33764;
  padding:30px;
  border-radius:20px;
  text-align:center;
  transition:0.4s;
  z-index:10;
}

.popup.active{
  transform:translate(-50%,-50%) scale(1);
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
}

.overlay.active{
  display:block;
}
</style>
</head>

<body>

<script>
/* balloons */
for(let i=0;i<20;i++){
  let balloon=document.createElement("div");
  balloon.className="balloon";
  balloon.innerHTML="🎈";
  balloon.style.left=Math.random()*100+"%";
  balloon.style.animationDuration=(5+Math.random()*5)+"s";
  balloon.style.fontSize=(25+Math.random()*25)+"px";
  document.body.appendChild(balloon);
}
</script>

<div class="card">
<h1>Happy Birthday 🎂</h1>
<div id="typewriter"></div>
<button onclick="showLove()">Open Surprise 🎁</button>
</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
<h2>You Are My Happiness 💖</h2>
<p>
Today is the birthday of the most beautiful soul in my life.  
I feel lucky that my future belongs with you.  
May your life be filled with love, laughter, and endless happiness.  

Happy Birthday my future wife. 🤍
</p>
<button onclick="closeLove()">Close</button>
</div>

<script>
const text="Happy Birthday to the most special woman in my life.\n\nYour smile lights up my world\nand your heart makes everything beautiful.\n\nToday I celebrate not just your birthday\nbut the wonderful person you are.\n\nOne day we will celebrate this day together\nas husband and wife.\n\nUntil then,\nmy heart will always wish you\nlove, happiness, and endless joy.\n\nHappy Birthday my love 🎂🤍";

let i=0;
function typeWriter(){
if(i<text.length){
document.getElementById("typewriter").innerHTML+=
text.charAt(i)==="\n"?"<br>":text.charAt(i);
i++;
setTimeout(typeWriter,40);
}
}
typeWriter();

function showLove(){
document.getElementById("popup").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closeLove(){
document.getElementById("popup").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}
</script>

</body>
</html>
